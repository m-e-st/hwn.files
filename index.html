<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weiterleitung...</title>

    <!-- Block crawlers/indexing -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="bingbot" content="noindex, nofollow">

    <!-- Immediate redirect (fallback for no-JS / slow JS) -->
    <meta http-equiv="refresh" content="0; url=https://www.hwn.de">

    <!-- Prevent caching of this redirect page -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="canonical" href="https://www.hwn.de">

    <script>
        // Immediate JS redirect (fires before render in most browsers)
        window.location.replace("https://www.hwn.de");
    </script>
</head>
<body>
    <p>Sie werden weitergeleitet zu <a href="https://www.hwn.de">https://www.hwn.de</a> ...</p>
    <noscript>
        <p>JavaScript ist deaktiviert. Bitte klicken Sie <a href="https://www.hwn.de">hier</a>, um fortzufahren.</p>
    </noscript>
</body>
</html>
